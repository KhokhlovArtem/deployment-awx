---
- name: Prepare clean Ubuntu target
  hosts: awx
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    - name: Validate OS and architecture before installing any packages
      ansible.builtin.raw: |
        set -eu
        . /etc/os-release
        test "$ID" = ubuntu
        test "$(uname -m)" = x86_64
        dpkg --compare-versions "$VERSION_ID" ge 24.04
      changed_when: false

    - name: Bootstrap system Python if absent
      ansible.builtin.raw: |
        set -eu
        if ! test -x /usr/bin/python3; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3
          echo AWX_PYTHON_INSTALLED
        fi
      register: python_bootstrap
      changed_when: "'AWX_PYTHON_INSTALLED' in python_bootstrap.stdout"

    - name: Gather target facts
      ansible.builtin.setup:

    - name: Check whether k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_preflight

    - name: Validate host resources before k3s installation
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] is version('24.04', '>=')
          - ansible_facts['architecture'] == 'x86_64'
          - ansible_facts['processor_vcpus'] | int >= 4
          - ansible_facts['memtotal_mb'] | int >= 7000
          - >-
            k3s_preflight.stat.exists or
            (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') |
             map(attribute='size_available') | first | int >= 26843545600)
        fail_msg: Ubuntu 24.04+ x86_64, 4 vCPU, 7 GB usable RAM and 25 GiB free on / are required.

  tasks:
    - name: Install remote system prerequisites
      ansible.builtin.apt:
        name: [python3-venv, python3-pip, ca-certificates, curl, git, openssl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Prepare remote Kubernetes module environment
      ansible.builtin.pip:
        name:
          - kubernetes==36.0.3
          - PyYAML==6.0.3
        virtualenv: /opt/awx-deploy-venv
        virtualenv_command: /usr/bin/python3 -m venv

- name: Deploy AWX on remote k3s
  hosts: awx
  gather_facts: true
  become: true
  vars:
    installer_home: "{{ ansible_facts['user_dir'] }}"
    ansible_python_interpreter: /opt/awx-deploy-venv/bin/python3
    kubeconfig: "{{ installer_home }}/.kube/config"
    awx_install_dir: "{{ installer_home }}/awx-install"
    k3s_version: v1.36.3+k3s1
    awx_admin_password: "{{ lookup('env', 'AWX_ADMIN_PASSWORD') }}"
    awx_postgres_password: "{{ lookup('env', 'AWX_POSTGRES_PASSWORD') }}"

  pre_tasks:
    - name: Validate deployment settings and secrets
      ansible.builtin.assert:
        that:
          - awx_nodeport | int >= 30000
          - awx_nodeport | int <= 32767
          - awx_namespace is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
          - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
          - awx_admin_password | length >= 16
          - awx_postgres_password | length >= 16
          - awx_admin_password not in ['change-me-strong', 'change-me']
          - awx_postgres_password not in ['change-me-db-strong', 'change-me']
          - >-
            (awx_receptor_ca_cert_path | length == 0 and
             awx_receptor_ca_key_path | length == 0 and
             awx_receptor_ca_generation | length == 0) or
            (awx_receptor_ca_cert_path | length > 0 and
             awx_receptor_ca_key_path | length > 0 and
             awx_receptor_ca_generation | length > 0)
      no_log: true

    - name: Ensure remote AWX install directory exists
      ansible.builtin.file:
        path: "{{ awx_install_dir }}"
        state: directory
        mode: "0755"

  roles:
    - role: k3s
    - role: awx
