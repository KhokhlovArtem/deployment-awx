---
- name: Uninstall AWX
  hosts: awx
  gather_facts: true
  become: true

  vars:
    installer_home: "{{ ansible_facts['user_dir'] }}"
    ansible_python_interpreter: /opt/awx-deploy-venv/bin/python3
    kubeconfig: "{{ installer_home }}/.kube/config"
    awx_instance_name: awx

  tasks:
    - name: Require explicit destructive deletion confirmation
      ansible.builtin.assert:
        that:
          - awx_delete_confirmed | default(false) | bool
          - awx_namespace is defined
        fail_msg: Use the controller with --confirm-delete matching --namespace. This deletes PVCs.

    - name: Delete AWX custom resource
      kubernetes.core.k8s:
        api_version: awx.ansible.com/v1beta1
        kind: AWX
        name: "{{ awx_instance_name }}"
        namespace: "{{ awx_namespace }}"
        state: absent
        kubeconfig: "{{ kubeconfig }}"

    - name: Delete AWX namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ awx_namespace }}"
        state: absent
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 600
