---
- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ awx_install_dir }}/install-k3s.sh"
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Install k3s
  ansible.builtin.command: "{{ awx_install_dir }}/install-k3s.sh"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "--write-kubeconfig-mode 600"
  become: true
  when: not k3s_binary.stat.exists

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
  become: true

- name: Ensure ~/.kube directory exists
  ansible.builtin.file:
    path: "{{ installer_home }}/.kube"
    state: directory
    mode: "0700"

- name: Protect the system kubeconfig
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "0600"
  become: true

- name: Copy k3s kubeconfig to user home
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ installer_home }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0600"
  become: true

- name: Wait for node to be Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: node_ready
  changed_when: false
  retries: 6
  delay: 10
  until: node_ready.rc == 0
