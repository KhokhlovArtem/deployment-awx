---
- name: Create AWX namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ awx_namespace }}"
    state: present
    kubeconfig: "{{ kubeconfig }}"

- name: Render kustomization for AWX Operator
  ansible.builtin.template:
    src: kustomization.yaml.j2
    dest: "{{ awx_install_dir }}/kustomization.yaml"
    mode: "0644"

- name: Build AWX Operator manifests on the target
  ansible.builtin.command:
    argv: [kubectl, kustomize, "{{ awx_install_dir }}"]
  register: awx_operator_manifests
  changed_when: false

- name: Apply AWX Operator via kustomize
  kubernetes.core.k8s:
    definition: "{{ awx_operator_manifests.stdout | from_yaml_all | list }}"
    state: present
    kubeconfig: "{{ kubeconfig }}"

- name: Wait for AWX Operator to be ready
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready pod
    -l control-plane=controller-manager
    -n {{ awx_namespace }} --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: operator_ready
  changed_when: false
  retries: 30
  delay: 10
  until: operator_ready.rc == 0

- name: Inspect existing credentials before any password update
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ awx_namespace }}"
    kubeconfig: "{{ kubeconfig }}"
  loop:
    - "{{ awx_admin_secret_name }}"
    - "{{ awx_postgres_secret_name }}"
  register: awx_existing_credentials
  no_log: true

- name: Refuse implicit password rotation on repeat deployment
  ansible.builtin.assert:
    that:
      - >-
        awx_existing_credentials.results[0].resources | length == 0 or
        (awx_existing_credentials.results[0].resources[0].data.password | b64decode == awx_admin_password)
      - >-
        awx_existing_credentials.results[1].resources | length == 0 or
        (awx_existing_credentials.results[1].resources[0].data.password | b64decode == awx_postgres_password)
    fail_msg: Existing credentials differ. Supply the original passwords; rotation is a separate procedure.
  no_log: true

- name: Create AWX admin secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ awx_admin_secret_name }}"
        namespace: "{{ awx_namespace }}"
      type: Opaque
      data:
        password: "{{ awx_admin_password | b64encode }}"
  no_log: true

- name: Create AWX postgres configuration secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ awx_postgres_secret_name }}"
        namespace: "{{ awx_namespace }}"
      type: Opaque
      data:
        host: "{{ awx_postgres_host | b64encode }}"
        port: "{{ awx_postgres_port | string | b64encode }}"
        database: "{{ awx_postgres_database | b64encode }}"
        username: "{{ awx_postgres_username | b64encode }}"
        password: "{{ awx_postgres_password | b64encode }}"
        sslmode: "{{ awx_postgres_sslmode | b64encode }}"
        type: "{{ awx_postgres_type | b64encode }}"
  no_log: true

- name: Inspect custom Receptor CA files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ awx_receptor_ca_cert_path }}"
    - "{{ awx_receptor_ca_key_path }}"
  register: awx_receptor_ca_files
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Validate custom Receptor CA files
  ansible.builtin.assert:
    that:
      - awx_receptor_ca_files.results[0].stat.isreg | default(false)
      - awx_receptor_ca_files.results[1].stat.isreg | default(false)
      - awx_receptor_ca_files.results[1].stat.mode in ['0400', '0600']
    fail_msg: >-
      The Receptor CA certificate and private key must be regular files, and
      the private key mode must be 0400 or 0600.
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Inspect custom Receptor CA certificate
  ansible.builtin.command:
    argv: "{{ ['openssl', 'x509', '-in', awx_receptor_ca_cert_path, '-noout'] + item }}"
  loop:
    - ['-checkend', '2592000']
    - ['-ext', 'basicConstraints']
    - ['-ext', 'keyUsage']
  register: awx_receptor_ca_certificate_checks
  changed_when: false
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Inspect custom Receptor CA public keys
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - ['openssl', 'x509', '-in', "{{ awx_receptor_ca_cert_path }}", '-pubkey', '-noout']
    - ['openssl', 'pkey', '-in', "{{ awx_receptor_ca_key_path }}", '-pubout']
    - ['openssl', 'pkey', '-in', "{{ awx_receptor_ca_key_path }}", '-check', '-noout']
  register: awx_receptor_ca_key_checks
  changed_when: false
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Validate custom Receptor CA properties
  ansible.builtin.assert:
    that:
      - "'CA:TRUE' in awx_receptor_ca_certificate_checks.results[1].stdout"
      - "'Certificate Sign' in awx_receptor_ca_certificate_checks.results[2].stdout"
      - awx_receptor_ca_key_checks.results[0].stdout == awx_receptor_ca_key_checks.results[1].stdout
    fail_msg: >-
      The Receptor CA must be valid for at least 30 days, have CA signing
      constraints, and match the supplied private key.
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Read validated Receptor CA certificate on the target
  ansible.builtin.slurp:
    src: "{{ awx_receptor_ca_cert_path }}"
  register: awx_receptor_cert_content
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Read validated Receptor CA key on the target
  ansible.builtin.slurp:
    src: "{{ awx_receptor_ca_key_path }}"
  register: awx_receptor_key_content
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Create custom Receptor CA secret
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ awx_receptor_ca_secret_name }}"
        namespace: "{{ awx_namespace }}"
      type: kubernetes.io/tls
      stringData:
        tls.crt: "{{ awx_receptor_cert_content.content | b64decode }}"
        tls.key: "{{ awx_receptor_key_content.content | b64decode }}"
  when: awx_receptor_ca_generation | length > 0
  no_log: true

- name: Deploy AWX custom resource
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'awx-cr.yaml.j2') | from_yaml }}"
    state: present
    kubeconfig: "{{ kubeconfig }}"

- name: Wait for AWX reconciliation to complete
  ansible.builtin.command: >-
    kubectl wait --for=condition=Successful
    awx/{{ awx_instance_name }}
    -n {{ awx_namespace }} --timeout=1200s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Wait for AWX deployments to be available
  ansible.builtin.command: >-
    kubectl rollout status deployment/{{ item }}
    -n {{ awx_namespace }} --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  loop:
    - "{{ awx_instance_name }}-web"
    - "{{ awx_instance_name }}-task"
  changed_when: false

- name: Wait for PostgreSQL to be available
  ansible.builtin.command: >-
    kubectl rollout status statefulset/{{ awx_postgres_host }}
    -n {{ awx_namespace }} --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Verify the AWX API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ awx_nodeport }}/api/v2/ping/"
    return_content: true
    status_code: 200
  register: awx_ping
  retries: 20
  delay: 15
  until:
    - awx_ping.status | default(0) == 200
    - awx_ping.json is defined
    - awx_ping.json.version is defined
    - awx_ping.json.instances is defined
    - awx_ping.json.instance_groups is defined

- name: Show post-install info
  ansible.builtin.debug:
    msg:
      - "AWX {{ awx_ping.json.version }} is ready."
      - "The controller will verify and print the external access URL."
      - "Login: {{ awx_admin_user }}"
      - "Password: supplied through the controller environment or hidden prompt"
